# Included from nginx.conf's http context. $remote_addr remains the trusted peer;
# the report accepts CF-Connecting-IP only when peer matches Cloudflare IP ranges.
log_format shimodocs_analytics escape=json
    '{"time":"$time_iso8601","peer":"$remote_addr",'
    '"client":"$http_cf_connecting_ip","host":"$host",'
    '"method":"$request_method","uri":"$request_uri",'
    '"status":$status,"content_type":"$sent_http_content_type",'
    '"referer":"$http_referer","ua":"$http_user_agent"}';
