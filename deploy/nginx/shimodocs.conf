server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/shimodocs/current;
    index index.html;
    charset utf-8;

    # Hashed build output never changes under the same name.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Crawler and social surfaces must be real files. Without these blocks the
    # SPA fallback answered /robots.txt and /sitemap.xml with text/html.
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /release.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|logo\.png|og-image\.png)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Every application route is prerendered to its own directory, so an unknown
    # path is a real 404 rather than the home page returned with a 200 status.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
}
