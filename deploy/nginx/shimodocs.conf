server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/shimodocs/current;
    index index.html;

    # Vite's BrowserRouter needs every client route to resolve to index.html.
    # Missing static assets must remain real 404s instead of returning the app shell.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
