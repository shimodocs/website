# Cloudflare proxies shimodocs.com to this origin and terminates TLS at its
# edge. One server block answers both plain HTTP and HTTPS, so the site behaves
# identically whether Cloudflare reaches the origin on port 80 ("Flexible") or
# on port 443 ("Full" / "Full (strict)"). No HTTP-to-HTTPS redirect lives here:
# behind a Flexible proxy such a redirect loops forever.
#
# /etc/nginx/ssl/shimodocs.com.{pem,key} holds the certificate. It starts as a
# self-signed placeholder so port 443 can be prepared before the domain moves,
# and is replaced by the Let's Encrypt certificate for shimodocs.com and
# www.shimodocs.com. Cloudflare's own edge certificate keeps existing visitors
# working during the switch, which matters because the current site already
# sends HSTS for a year.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name shimodocs.com www.shimodocs.com;

    # Install analytics-log-format.conf in /etc/nginx/conf.d/ first.
    access_log /var/log/nginx/access.log combined;
    access_log /var/log/nginx/shimodocs-analytics.log shimodocs_analytics;

    ssl_certificate     /etc/nginx/ssl/shimodocs.com.pem;
    ssl_certificate_key /etc/nginx/ssl/shimodocs.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/shimodocs/current;
    index index.html;
    charset utf-8;

    # The HTTP-01 challenge must be answerable before any real certificate is
    # installed, including while Cloudflare is still proxying the name.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # www is not the canonical host: src/seo.js emits https://shimodocs.com.
    if ($host = www.shimodocs.com) {
        return 301 https://shimodocs.com$request_uri;
    }

    # ------------------------------------------------------------------ legacy
    # URLs the previous site published and Google already has indexed. Each one
    # 301s to the closest page on this site, so an indexed listing transfers
    # instead of turning into a 404. /about, /comparison, /download and both
    # legal pages keep their original paths, so they need no entry here.
    location = /contact { return 301 /contact-sales; }
    location = /blogs   { return 301 /blog; }

    location = /blogs/google-docs-vs-private-cloud-collaboration {
        return 301 /blog/shimodocs-vs-google-docs;
    }
    location = /blogs/self-hosted-collaboration-guide {
        return 301 /blog/self-hosted-collaboration-guide;
    }
    location = /blogs/enterprise-ai-data-security-agents {
        return 301 /blog/ai-agents-in-documents-security;
    }
    location = /blogs/financial-services-secure-document-collaboration {
        return 301 /blog/secure-document-collaboration-financial-services;
    }
    location = /blogs/secure-cloud-collaboration {
        return 301 /blog/secure-cloud-collaboration;
    }
    location = /blogs/ai-training-content-control {
        return 301 /blog/ai-training-content-control;
    }
    location = /blogs/web3-security-tools-resources {
        return 301 /blog/web3-security-tools-resources;
    }
    location = /blogs/data-sovereignty-enterprise-control {
        return 301 /blog/data-sovereignty-document-collaboration;
    }
    location = /blogs/private-cloud-vs-public-cloud-document-collaboration {
        return 301 /blog/what-is-private-cloud-document-collaboration;
    }
    location = /blogs/google-docs-alternative-private-cloud {
        return 301 /blog/google-docs-alternative-private-cloud;
    }
    location = /blogs/private-cloud-collaboration-guide {
        return 301 /blog/what-is-private-cloud-document-collaboration;
    }

    # Orphaned articles that were published on the previous site and deleted
    # before the migration: five posts about "Finet", a finance-automation
    # product with no counterpart on this site. Google still lists them under
    # "Not found (404)" and they were already out of the index, so the archive is
    # the honest destination — no article here shares their subject.
    location = /blogs/automate-analyze-achieve-the-power-of-finet {
        return 301 /blog;
    }
    location = /blogs/the-ultimate-guide-to-finance-automation-with-finet {
        return 301 /blog;
    }
    location = /blogs/5-ways-finet-simplifies-your-business-finances {
        return 301 /blog;
    }
    location = /blogs/master-your-money-with-finet-s-smart-automation {
        return 301 /blog;
    }
    location = /blogs/boost-your-business-growth-with-finet-analytics {
        return 301 /blog;
    }

    # Anything else under the old blog path — a post deleted before the
    # migration, or one that no sitemap and no crawl could enumerate — lands on
    # the archive instead of a 404. The new blog lives at /blog, so this cannot
    # shadow a real page.
    location ~ ^/blogs/.+ {
        return 301 /blog;
    }

    # Same safety net for children of the old resource hub.
    location ~ ^/resources/.+ {
        return 301 /resources;
    }

    # Hashed build output never changes under the same name.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Crawler and social surfaces must be real files. Without these blocks the
    # SPA fallback answered /robots.txt and /sitemap.xml with text/html.
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # sitemap.xml is an index over one urlset per content type and, for the
    # documentation, per language. sitemap-core.xml holds the commercial pages
    # and is indexed first. They are static files like any other, but they belong
    # in the crawler surface rather than in the no-cache default.
    location ~ ^/sitemap-(core|pages|blog|docs-[a-z]{2})\.xml$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /release.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|logo\.png|og-image\.png)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # One URL per page. /ai-workspace/ redirects to /ai-workspace, which is the
    # form used by the canonical link and the sitemap.
    location ~ ^/(.+)/$ {
        return 301 /$1;
    }

    # The error document is reachable only through error_page, never directly.
    location = /404.html {
        internal;
    }

    # Each route is prerendered to its own directory. Matching $uri/index.html
    # before $uri serves /ai-workspace with a 200 instead of letting nginx
    # answer with a 301 to the trailing-slash form. An unknown path is a real
    # 404 rather than the home page returned with a 200.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri/index.html $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
}
