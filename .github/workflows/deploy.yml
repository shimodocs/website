name: Deploy tagged ShimoDocs release

on:
  push:
    tags: ['v*']

concurrency:
  group: shimodocs-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_PATH: /var/www/shimodocs

jobs:
  build-and-deploy:
    if: github.repository == 'shimodocs/website' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Canonical URLs, the sitemap and social images all derive from this.
          # Set the repository variable SITE_URL once the production domain is
          # ready, for example https://shimodocs.com, and tag a new release.
          VITE_SITE_URL: ${{ vars.SITE_URL || 'http://43.172.115.22' }}
        run: npm run build

      - name: Record release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/release.json', JSON.stringify({
            tag: process.env.RELEASE_TAG,
            commit: process.env.RELEASE_SHA,
            repository: process.env.RELEASE_REPOSITORY,
            release: process.env.RELEASE_ID
          }) + '\n');
          NODE

      - name: Package static files
        run: tar -czf shimodocs-dist.tgz -C dist .

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -n "$DEPLOY_USER"
          ssh_options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=10)
          scp "${ssh_options[@]}" -P "$DEPLOY_PORT" shimodocs-dist.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/shimodocs-$RELEASE_ID.tgz"
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE_ID='$RELEASE_ID' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          test -w "$DEPLOY_PATH/releases"
          release_dir="$DEPLOY_PATH/releases/$RELEASE_ID"
          mkdir "$release_dir"
          tar -xzf "/tmp/shimodocs-$RELEASE_ID.tgz" -C "$release_dir"
          # Refuse to activate a release that is missing the app shell, the
          # release record, or any crawler surface.
          test -s "$release_dir/index.html"
          test -s "$release_dir/release.json"
          test -s "$release_dir/robots.txt"
          test -s "$release_dir/sitemap.xml"
          test -s "$release_dir/404.html"
          for route in ai-workspace blog help-center pricing contact-sales; do
            test -s "$release_dir/$route/index.html"
          done
          ln -s "$release_dir" "$DEPLOY_PATH/.current-$RELEASE_ID"
          mv -Tf "$DEPLOY_PATH/.current-$RELEASE_ID" "$DEPLOY_PATH/current"
          unlink "/tmp/shimodocs-$RELEASE_ID.tgz"
          REMOTE

      - name: Verify deployed pages and crawler surfaces
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          curl --fail --silent --show-error --max-time 15 "http://$DEPLOY_HOST/release.json" -o live-release.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const release = JSON.parse(readFileSync('live-release.json', 'utf8'));
          assert.equal(release.tag, process.env.RELEASE_TAG);
          assert.equal(release.commit, process.env.RELEASE_SHA);
          assert.equal(release.repository, process.env.RELEASE_REPOSITORY);
          assert.equal(release.release, process.env.RELEASE_ID);
          console.log(`Release metadata OK: ${release.repository} ${release.tag} (${release.commit})`);

          const origin = `http://${process.env.DEPLOY_HOST}`;
          const routes = ['/', '/ai-workspace', '/blog', '/help-center', '/pricing', '/contact-sales'];

          const get = async path => {
            const response = await fetch(origin + path);
            return {
              status: response.status,
              type: response.headers.get('content-type') || '',
              body: await response.text(),
            };
          };

          const titles = new Set();
          for (const route of routes) {
            const res = await get(route);
            assert.equal(res.status, 200, `${route} returned ${res.status}`);
            assert.match(res.body, /<div id="root">\s*\S/, `${route} shipped without prerendered markup`);
            assert.match(res.body, /<h1[\s>]/, `${route} has no <h1>`);
            assert.match(res.body, /rel="canonical"/, `${route} has no canonical link`);
            assert.match(res.body, /application\/ld\+json/, `${route} has no structured data`);
            const title = res.body.match(/<title>([^<]+)<\/title>/);
            assert.ok(title, `${route} has no <title>`);
            titles.add(title[1]);
          }
          assert.equal(titles.size, routes.length, 'routes share duplicate titles');

          const robots = await get('/robots.txt');
          assert.equal(robots.status, 200, `/robots.txt returned ${robots.status}`);
          assert.match(robots.type, /text\/plain/, `/robots.txt served as ${robots.type}`);
          assert.match(robots.body, /Sitemap:\s*https?:\/\//, '/robots.txt is missing the Sitemap directive');

          const sitemap = await get('/sitemap.xml');
          assert.equal(sitemap.status, 200, `/sitemap.xml returned ${sitemap.status}`);
          assert.match(sitemap.type, /xml/, `/sitemap.xml served as ${sitemap.type}`);
          for (const route of routes) {
            const loc = route === '/' ? `${origin}/` : `${origin}${route}`;
            assert.ok(sitemap.body.includes(`<loc>${loc}</loc>`), `sitemap.xml is missing ${loc}`);
          }

          const missing = await get('/not-a-real-shimodocs-page');
          assert.equal(missing.status, 404, 'unknown paths must 404 instead of serving the app shell');

          // The homepage download CTA points at a release asset whose file name
          // embeds the installer version. If a future release renames that
          // asset the button breaks silently, so resolve it here. A ranged
          // request avoids pulling the full installer.
          const home = await get('/');
          const installerLinks = [
            ...home.body.matchAll(/href="(https:\/\/github\.com\/shimodocs\/shimodocs\/releases\/latest\/download\/[^"]+)"/g),
          ].map(match => match[1]);
          assert.ok(installerLinks.length >= 2, `homepage exposes ${installerLinks.length} installer links, expected at least 2`);
          for (const link of installerLinks) {
            const response = await fetch(link, { headers: { Range: 'bytes=0-0' }, redirect: 'follow' });
            assert.ok(
              response.ok || response.status === 206,
              `installer link does not resolve: ${link} (${response.status})`,
            );
            console.log(`Download OK: ${link.split('/').pop()}`);
          }

          console.log(`Verified ${routes.length} prerendered routes, unique titles, robots.txt, sitemap.xml, a real 404 and ${installerLinks.length} installer links.`);
          NODE
