name: Build ShimoDocs website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The build prerenders every route and fails if a page would ship without
      # a unique title, canonical link or structured data.
      - name: Build and prerender
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL || 'http://43.172.115.22' }}
        run: npm run build
      - name: Report crawler surfaces
        run: |
          echo "--- routes ---"
          find dist -name index.html | sort
          echo "--- robots.txt ---"
          cat dist/robots.txt
          echo "--- sitemap.xml urls ---"
          grep -c '<loc>' dist/sitemap.xml
