<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browsers cache favicons for days and refresh them on their own schedule,
         so the version in the query string is what actually makes a new icon
         show up. Bump it whenever the artwork changes. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <!-- The mark is dark, so it disappears on a dark tab bar. Same artwork,
         inverted, for browsers that report a dark colour scheme. -->
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-dark.svg?v=2" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#090713" />
    <meta name="application-name" content="ShimoDocs" />
    <meta name="apple-mobile-web-app-title" content="ShimoDocs" />
    <link rel="preload" href="/assets/dm-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/space-grotesk-600.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-54Y8LLP4CR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-54Y8LLP4CR');
    </script>
    <!--seo-head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
